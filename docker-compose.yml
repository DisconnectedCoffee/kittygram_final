version: '3.8'

volumes:
  pg_data:
  static:
  media:

services:
  db:
    image: postgres:13
    volumes:
      - pg_data:/var/lib/postgresql/data/
    env_file:
      - .env

  backend:
    build: ./backend/
    volumes:
      - static:/app/static/
      - media:/app/media/
    depends_on:
      - db
    env_file:
      - .env

  frontend:
    build: ./frontend/
    volumes:
      - static:/app/result_static/
    command: cp -r /app/build/. /app/result_static/

  gateway:
    build: ./nginx/
    ports:
      - "80:80"
    volumes:
      - static:/usr/share/nginx/html/
      - media:/app/media/
    depends_on:
      - backend
      - frontend